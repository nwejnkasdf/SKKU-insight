# BroadInterest 12 entry 시드 SOR (A3 도입).
#
# A3 의 `scripts/import_cso.py` 가 CSO 임포트 직후 본 파일을 읽어 BroadInterest 테이블에
# `ON CONFLICT (name) DO UPDATE` 로 시드. `seed_topic_label` 은 CSO 3.4 원본 라벨 — lowercase
# 정규화 후 cso_topic 테이블에서 cso_topic_id 로 resolve.
#
# 12 unique cluster (cso-mapping.md §12 클러스터). cluster_label "Graphics·Multimedia" 는
# CSO 의 "Computer Graphics" + "Multimedia" 2 seed 가 동일 cluster — BroadInterest 시드는
# 더 광범위한 "Computer Graphics" 1 entry 만 사용 (Multimedia 산하 노드는 BFS 라벨링으로
# 동일 cluster_label 부여).
#
# description_ko 는 한 문장. UI 의 BroadInterest 카드에 노출 (FR-08·13).

