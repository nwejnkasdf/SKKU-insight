name = "AI"
description_ko = "기계가 인간의 지능적 행동을 모방하도록 만드는 분야. 머신러닝·딥러닝·자연어처리·컴퓨터 비전 등을 포괄."
cso_cluster_label = "AI"
seed_topic_label = "Artificial Intelligence"
display_order = 0

