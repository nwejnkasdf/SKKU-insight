# Recommendation engine 설정 (A8).
#
# 본 파일은 algorithms/recommendation-ranking.md §신뢰도 임계 + §다양성 룰 + §core_slot_quota
# 의 SOR. lifespan 부팅 시 1회 로드되어 `app/recommendation/config_loader.py:RecommendationConfig`
# dataclass 로 박혀 endpoint 호출마다 재사용. 운영 시점 갱신은 backend 재시작 (A10
# admin-console 가 system_config DB 갱신 후 backend reload 트리거 방식은 backlog).

[slot_targets]
core = 5
adjacent = 3
discovery = 2
total = 10

[confidence_thresholds]
# 슬롯에 들어갈 자격 — 이 이하 후보는 강제 보충 대상이 아니라 다른 슬롯으로 대체 (FR-42).
core_min_topic_match = 0.75      # bucket_score × topic_confidence
adjacent_min_topic_match = 0.55
discovery_min_topic_match = 0.30
discovery_required_trust_level = "high"   # discovery 는 trust=high 만

[freshness]
# Document.published_at 기준 wallclock(달력) 일수 — 사용자 active day 무관.
# (C-51 baseline default, 2026-05-24) slot 별 override 미지정 시 사용. core 와 동일.
# 24h 이내 1.0, 30d 이상 0.3 floor 로 선형 감쇠.
fresh_full_hours = 24
fresh_floor_after_wallclock_days = 30
fresh_floor_value = 0.3

[freshness.core]
# 핵심 관심 — 안정성 우선. 30일 후 floor 0.3 (옛 자료도 일정 가중치 유지).
fresh_full_hours = 24
fresh_floor_after_wallclock_days = 30
fresh_floor_value = 0.3

[freshness.adjacent]
# 인접 분야 — 좀 더 fresh 우선. 14일 후 floor 0.2.
fresh_full_hours = 24
fresh_floor_after_wallclock_days = 14
fresh_floor_value = 0.2

[freshness.discovery]
# (C-52 정정, 2026-05-24) discovery = 매일 새 발견 본질 + Reincarnation = 옛 trace
# 영역의 fresh Document 추천. 둘 다 published_at decay 적용 부자연 — 의도:
#   1. discovery slot = 매일 hard refresh (옛 카드 안 보임, _select_latest_recommendations 분기)
#   2. Reincarnation = "옛 관심의 *새* 동향" 추천이라 Document 자체는 fresh 가 의미.
#      "Document 옛 자료" 보호 명목 floor 유지는 디자인 오해 — Reincarnation 의 archive 는
#      *trace* 차원이지 *Document* 차원 아님.
# 따라서 freshness factor 항상 1.0 강제 (decay 자체 부재). 모든 Document 동일 freshness 점수.
# fresh_full_hours / fresh_floor_after_wallclock_days 는 무의미한 placeholder.
# 후속 PR (C-53?) 에서 강한 신호 시 discovery → core promotion 메커니즘 추가 예정.
fresh_full_hours = 24
fresh_floor_after_wallclock_days = 1
fresh_floor_value = 1.0

[trust_level_weights]
high = 1.0
medium = 0.85
low = 0.6

[ranking_weights]
# 최종 점수 = topic_match * w_match + freshness * w_fresh + trust * w_trust
# NFR-06 — topic_match 1순위 정렬 기준.
# (C-51, 2026-05-24) w_fresh 0.2 → 0.35 강화 — 사용자 의도 "최신성 추천 핵심" 부합.
w_match = 0.55
w_fresh = 0.35
w_trust = 0.1

[diversification]
# 동일 source 슬롯당 최대.
max_per_source_in_slot = 2
# 동일 leaf_topic 슬롯당 최대 (leaf=None 후보는 cap 면제).
max_per_leaf_in_slot = 3

[core_slot_quota]
# C-4 해소 (cso-topic-traversal.md §6.2): core 5 중 1 emerging 우선.
# emerging 후보 부재 시 active leaf 로 자동 회수.
emerging_leaf_quota_in_core = 1

[bucket_score]
# interest-bayesian.md §3 bucket 값 → ranking 의 bucket_score 가중치.
high = 1.0
medium = 0.7
low = 0.4
neutral = 0.2

[fallback]
# FR-43 단계 임계.
# 1단계: 인접 토픽 hops=2 (current 영역의 그래프 2-hop) trust=high 트렌드.
adjacent_hops_2 = 2
# 2단계: 신뢰 소스 전체 트렌드 (사용자 토픽 무관) 최근 7 wallclock days.
trend_window_days = 7
# 3단계: 신뢰 소스 archive (최근 30 wallclock days).
archive_window_days = 30
