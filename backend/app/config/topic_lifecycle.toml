# SKKU InSight — topic lifecycle config (A7, 2026-05-17).
#
# 본 TOML 은 leaf-topic-lifecycle.md + cso-topic-traversal.md §11 의 임계값을 통합 SOR
# 으로 제공한다. lifespan 부팅 시 1회 로드 (hot-reload 미지원 — A10 admin UI 도입 시
# 검토). 같은 임계가 env (Settings) 에도 정의되어 있고, **env 가 TOML 을 override**
# 한다 (운영 시 hot toggle 용).
#
# A7 결정 매트릭스 (decisions.md §12, 23건) 반영. 본 TOML 갱신 시 env 와 동기화 필수
# (scripts/check_env.py 와 별도 — TOML key 정합성은 lifespan 가드가 책임).

# ============================================================
# Leaf 라이프사이클 — emerging ↔ active ↔ stale ↔ archived (룰 기반 전이)
# ============================================================

[promotion]
# emerging → active 승격 (leaf-topic-lifecycle.md §promotion).
emerging_to_active_window_active_days = 7
emerging_to_active_min_documents = 5
emerging_to_active_min_interest_signals = 2

[demotion]
# active → stale 강등 (idle active days, daily cron 일괄).
active_to_stale_idle_active_days = 21
# stale → archived 폐기 (idle 누적, daily cron).
stale_to_archived_idle_active_days = 90
# emerging → archived 폐기 (승격 전 idle 만료, daily cron).
emerging_to_archived_idle_active_days = 14

[reactivation]
# stale → active 재활성화 (window 내 문서·관심신호 임계, ingest 직후 즉시).
stale_to_active_window_active_days = 7
stale_to_active_min_documents = 3
stale_to_active_min_interest_signals = 1

# ============================================================
# Leaf 식별 (emerging) — LLM identify_emerging (daily, collection cron 직후 hook)
# ============================================================

[identification]
# A4 collection job 완료 → leaf_lifecycle_job RQ enqueue (결정 #14).
daily_after_collection = true
# 일일 사용자별 채택 최대 emerging 수.
max_new_leaves_per_day = 3
# 식별 호출 trigger — 신규 문서 ≥ N 이 모일 때.
min_documents_for_identification = 3
# Strict 검증: confidence ≥ 임계 미만 candidate 자동 거부.
confidence_min = 0.6
# Strict 검증: supporting_documents 길이 ≥ N.
supporting_documents_min = 3
# Strict 검증: 기존 active leaf 라벨 의미유사도 ≥ 임계 dedup.
label_similarity_dedup = 0.75
# LLM input window — A4 collection 결과 + UserEvent click/save union (결정 #18 옵션 D).
input_window_hours = 24
# emerging 후보는 active trace path 위 노드 산하만 (그래프 자식 1-hop 포함).
trace_anchor_required = true
# trace_anchor 위반 시 LLM 재호출 cap. 2차도 실패 시 빈 응답 + warning log.
llm_anchor_retry_cap = 1

# ============================================================
# Leaf 병합 (LLM evaluate_merges) — 주 1회 cron
# ============================================================

[merge]
# 주간 cron (월 03 UTC, env MERGE_EVALUATION_CRON 가 override).
weekly_evaluation_cron = "0 3 * * 1"
# 후보 임계 — Jaccard 와 라벨 의미유사도 양쪽 모두 임계 충족 시 LLM 평가.
jaccard_min = 0.6
label_similarity_min = 0.75
# 사용자당 주간 evaluate 최대 leaf 수 (LLM context 보호).
max_leaves_per_user_to_evaluate = 50

# ============================================================
# Trace operation — extend / retract / split / archive / merge (A7 신규)
# ============================================================

[traversal]
# 자식 노드 인터랙션 ≥ N 시 extend 룰 trigger.
extend_min_interactions = 5
# 1단계 stale 마킹 — score_tail ≤ 임계 AND idle ≥ N (ingest 즉시, no LLM).
stale_threshold_score = 0.30
stale_idle_active_days = 21
# 2단계 retract — stale 누적 추가 N → daily cron 시 LLM 재배치 + path.pop.
retract_after_stale_active_days = 14
# 3단계 archive — stale 누적 N → status='archived' (no LLM).
archive_after_stale_active_days = 90
# split window — 두 자식 동시 extend 임계 도달 (active days).
# split 후 T 단축 + T'=분기점+B (결정 #20, cso-topic-traversal.md §3.3 docs 갱신).
split_window_active_days = 7
# 사용자당 active trace 최대 수. 초과 시 새 trace 거부 또는 가장 idle archive.
max_active_traces_per_user = 10
# trace.path 최대 깊이. extend 시 cap 초과 차단.
max_path_depth = 8
# (A7 신규, 결정 #21) trace merge 룰 trigger — path overlap ≥ N cso_topic.
merge_path_overlap_min = 3
# (A7 신규, 결정 #23) daily trace merge cron — 18 UTC = 03 KST (decay 와 같은 시각).
merge_daily_cron = "0 18 * * *"

# ============================================================
# Propagation (cso-topic-traversal.md §4) — A6 propagation.py 가 사용
# ============================================================

[propagation]
# 1-hop 감쇠 factor. path 위 조상 노드로 hop_decay^hop 전파.
hop_decay = 0.5
# 최대 hop 깊이.
max_hops = 4
# trace 외 그래프 조상 (path 위 X) 으로 propagate 여부.
non_trace_ancestor_propagate = false
