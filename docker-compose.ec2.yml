services:
  api:
    ports: !override []
  admin-console:
    ports: !override []
  client:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_BASE_URL: https://skkuinsight.germy.kr
    command:
      - sh
      - -c
      - npm ci && npm run build && npx --yes http-server dist-renderer -p 4173 -a 0.0.0.0
    volumes:
      - ./client:/app:rw
      - client_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      client:
        condition: service_started

volumes:
  caddy_data: {}
  caddy_config: {}
  client_node_modules: {}
