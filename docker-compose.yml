# SKKU InSight — A2 Phase 0b docker-compose.
# 5 서비스 default: postgres, redis, api, worker, admin-console.
# clickbait-detector 는 옵션 (외부 호스팅이 default — backend 는 CLICKBAIT_SERVICE_URL env 로만 호출).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 호스트 5432 가 native PostgreSQL 과 충돌 가능 → 5433 으로 매핑 (2026-05-16).
      # 컨테이너 내부 (api ↔ postgres) 통신은 `postgres:5432` 그대로 유지.
      # 호스트 client (psql 등) 접근 시: `psql -h localhost -p 5433`
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    # Worker 병렬 정책 (decision-backlog C-19, C-20):
    # - UVICORN_WORKERS>1 시 LLM 동시성 가드(MAX_CONCURRENT, PER_USER) 는
    #   Redis 분산 semaphore (`_concurrency.py` Lua atomic) 가 전역 캡 보장.
    # - DB pool 은 process 독립. 총 connection =
    #     UVICORN_WORKERS * PG_API_POOL_MAX + PG_WORKER_POOL_MAX
    #   가 PostgreSQL `max_connections` (default 100) 이하 되도록 운영자 조정.
    # - 본 데모 default UVICORN_WORKERS=1 (10-20 명 시연에 충분).
    command:
      - sh
      - -c
      - "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # CodexOAuthProvider 본문 (2026-05-18). LLM_PROVIDER=codex_oauth 토글 시
      # 호스트의 codex login 토큰 재사용. read-write — codex CLI 가 refresh 시
      # auth.json 을 file lock 하에 atomic rewrite. ro 로 묶으면 refresh 실패.
      # 호스트에 ~/.codex 없으면 docker compose 가 빈 디렉토리 생성 → codex CLI
      # 가 unauthorized 로 ProviderError → lifespan 가드가 부트 시 잡음.
      - ${HOME}/.codex:/root/.codex
      # CSO 3.4.1 CSV 캐시 (P2-19, 2026-05-19). `make import-cso` 가 컨테이너 안에서
      # /app/.cache/cso/CSO.3.4.1.csv (~26MB) 다운로드 후 본 volume 에 영속화.
      # 호스트에 미리 받은 파일은 `make seed-cso-cache FILE=...` 로 카피.
      # 미선언 시 컨테이너 재시작마다 재다운로드 (CSO KMI 서버 트래픽 + 부트 지연).
      # backend/scripts/import_cso.py:45 CACHE_DIR = /app/.cache/cso.
      - cso_cache:/app/.cache/cso
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_URL_QUEUE: ${REDIS_URL_QUEUE}
    volumes:
      # api 와 동일 — worker 잡 (cold_start, collection 등) 도 codex_oauth 호출.
      - ${HOME}/.codex:/root/.codex
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "rq info --url $${REDIS_URL_QUEUE} | grep -q '0 workers, 0 queues' && exit 1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin-console:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "echo 'admin-console 빈 컨테이너 — A10 가 Next.js 부트' && tail -f /dev/null"]
    environment:
      NEXT_PUBLIC_API_BASE: ${API_PUBLIC_BASE}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      api:
        condition: service_healthy

  # clickbait-detector:
  #   build:
  #     context: ./clickbait_module
  #   ports:
  #     - "127.0.0.1:8100:8100"
  #   volumes:
  #     - ./clickbait_module/adapter:/app/adapter:ro
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
  #     interval: 15s
  #     timeout: 3s
  #     retries: 3

volumes:
  pg_data: {}
  redis_data: {}
  # CSO 3.4 CSV 캐시 (P2-19, 2026-05-19). api 컨테이너의 /app/.cache/cso 마운트.
  # CSO KMI 서버 (cso.kmi.open.ac.uk) 가 50MB CSV 제공 — 재시작마다 재다운로드 회피.
  cso_cache: {}
