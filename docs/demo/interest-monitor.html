<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKKU InSight · Live Interest Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fbf9f3;             /* near-white, faint warmth */
      --bg-panel: #f5f1e6;        /* paper card */
      --bg-card: #ede7d6;         /* nested card */
      --border: rgba(28, 25, 23, 0.10);
      --border-hi: rgba(28, 25, 23, 0.22);
      --border-sel: rgba(15, 118, 110, 0.45);
      --text-0: #1c1917;         /* stone-900 */
      --text-1: #44403c;         /* stone-700 */
      --text-2: #78716c;         /* stone-500 */
      --text-3: #a8a29e;         /* stone-400 */
      --accent: #0f766e;         /* teal-700 */
      --accent-dim: rgba(15, 118, 110, 0.45);
      --amber: #c2410c;          /* orange-700 */
      --green: #15803d;          /* green-700 */
      --bucket-high: #0f766e;    /* teal-700 */
      --bucket-med: #c2410c;     /* orange-700 */
      --bucket-low: #a8a29e;     /* stone-400 */
      --grid: rgba(28, 25, 23, 0.055);
      --grid-major: rgba(28, 25, 23, 0.11);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, var(--grid) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
        linear-gradient(to right, var(--grid-major) 1px, transparent 1px),
        linear-gradient(to bottom, var(--grid-major) 1px, transparent 1px);
      background-size: 32px 32px, 32px 32px, 160px 160px, 160px 160px;
      background-position: 0 0, 0 0, 0 0, 0 0;
      color: var(--text-0);
      font-family: 'Inter', 'Noto Sans KR', system-ui, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      letter-spacing: 0.01em;
    }
    #root { width: 100vw; height: 100vh; }
    .mono { font-family: 'JetBrains Mono', monospace; font-feature-settings: 'tnum' 1; }

    /* ───── Layout grid ───── */
    .app {
      display: grid;
      grid-template-rows: 56px 1fr;
      grid-template-columns: 260px 1fr 320px;
      grid-template-areas:
        "header header header"
        "users  graph  detail";
      height: 100vh;
    }

    /* ───── Header ───── */
    .header {
      grid-area: header;
      display: flex; align-items: center; padding: 0 22px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      width: 22px; height: 22px; border-radius: 5px;
      background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%);
      position: relative;
    }
    .brand-mark::after {
      content: ''; position: absolute; inset: 5px;
      border: 1.5px solid rgba(236, 254, 248, 0.85); border-radius: 50%;
      border-right-color: transparent;
    }
    .brand-title { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
    .brand-title .dim { color: var(--text-2); font-weight: 400; }
    .brand-sub { font-size: 10px; color: var(--text-3); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 1px; }

    .header-spacer { flex: 1; }
    .header-meta { display: flex; gap: 28px; align-items: center; }
    .meta-cell { display: flex; flex-direction: column; gap: 1px; align-items: flex-end; }
    .meta-label { font-size: 9px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em; }
    .meta-value { font-size: 12px; color: var(--text-0); font-family: 'JetBrains Mono', monospace; }

    .live-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 4px 9px 4px 8px;
      border: 1px solid rgba(21, 128, 61, 0.28);
      background: rgba(21, 128, 61, 0.08);
      border-radius: 4px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.14em;
      color: var(--green);
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 4px rgba(21, 128, 61, 0.6);
      animation: livePulse 1.8s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* ───── Users panel (left) ───── */
    .panel-users {
      grid-area: users;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 14px 24px;
    }
    .panel-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.18em;
      color: var(--text-2); text-transform: uppercase;
      margin-bottom: 14px; padding: 0 4px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .count-pill {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      color: var(--text-1); padding: 1px 6px; border-radius: 3px;
      border: 1px solid var(--border);
    }

    .user-card {
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      background: var(--bg-card);
      transition: border-color 0.12s, background 0.12s;
      position: relative;
    }
    .user-card:hover { border-color: var(--border-hi); }
    .user-card.selected {
      border-color: var(--border-sel);
      background: rgba(15, 118, 110, 0.07);
    }
    .user-card.selected::before {
      content: ''; position: absolute; left: -1px; top: 8px; bottom: 8px;
      width: 2px; background: var(--accent); border-radius: 2px;
    }
    .uc-row1 { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .uc-id { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-0); }
    .uc-active-mark {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); box-shadow: 0 0 6px var(--green);
      margin-left: auto;
    }
    .uc-active-mark.idle { background: var(--text-3); box-shadow: none; }
    .uc-persona { font-size: 12px; color: var(--text-0); font-weight: 500; margin-bottom: 8px; line-height: 1.3; }
    .uc-stats {
      display: flex; gap: 14px; font-size: 10px; color: var(--text-2);
      font-family: 'JetBrains Mono', monospace;
    }
    .uc-stats .k { color: var(--text-3); }

    /* ───── Graph (center) ───── */
    .panel-graph {
      grid-area: graph;
      position: relative;
      background: transparent;
      overflow: hidden;
    }
    .graph-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .graph-meta {
      position: absolute; top: 14px; left: 18px; z-index: 5;
      display: flex; flex-direction: column; gap: 2px;
    }
    .graph-meta .gm-1 { font-size: 11px; color: var(--text-2); letter-spacing: 0.04em; }
    .graph-meta .gm-2 { font-size: 18px; color: var(--text-0); font-weight: 600; letter-spacing: -0.01em; }
    .graph-legend {
      position: absolute; bottom: 14px; left: 18px; z-index: 5;
      display: flex; gap: 14px; align-items: center;
    }
    .lg-item { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-2); letter-spacing: 0.04em; }
    .lg-dot { width: 7px; height: 7px; border-radius: 50%; }
    .lg-dot.high { background: var(--bucket-high); }
    .lg-dot.med { background: var(--bucket-med); }
    .lg-dot.low { background: var(--bucket-low); }
    .lg-line { width: 14px; height: 0; border-top: 1.5px solid; }
    .lg-line.active { border-color: var(--accent); }
    .lg-line.stale { border-color: var(--text-3); border-top-style: dashed; }

    /* SVG */
    .node-core { transition: r 0.15s, filter 0.15s; cursor: pointer; }
    .node-label {
      fill: var(--text-1); font-size: 11px; font-weight: 500;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      pointer-events: none; user-select: none;
      paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round;
    }
    .node-label.hi { fill: var(--text-0); }
    .node-label.dim { fill: var(--text-2); }
    .node-label.hidden { opacity: 0; transition: opacity 0.15s; }
    .node-group:hover .node-label.hidden { opacity: 1; }
    .node-onb {
      fill: none; stroke: rgba(28, 25, 23, 0.45); stroke-width: 1;
      stroke-dasharray: 1.5 2;
      pointer-events: none;
    }
    .node-group:hover .node-core { filter: brightness(1.4); }
    .node-group:hover .node-label { fill: var(--accent); }
    .node-group.selected .node-core { filter: brightness(1.5) drop-shadow(0 0 6px var(--accent)); }
    .node-group.selected .node-label { fill: var(--accent); font-weight: 600; }

    .edge { fill: none; stroke-linecap: round; }
    .edge.active {
      stroke: var(--accent); stroke-width: 1.6; opacity: 0.6;
      stroke-dasharray: 4 5;
      animation: edgeFlow 1.4s linear infinite;
    }
    .edge.active.selected { opacity: 1; stroke-width: 2.4; filter: drop-shadow(0 0 5px var(--accent-dim)); }
    .edge.stale { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.5; }
    @keyframes edgeFlow {
      from { stroke-dashoffset: 9; }
      to { stroke-dashoffset: 0; }
    }

    /* ───── Detail panel (right) ───── */
    .panel-detail {
      grid-area: detail;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 16px 24px;
      display: flex; flex-direction: column;
    }

    .traces-list { margin-bottom: 20px; }
    .trace-row {
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 5px;
      margin-bottom: 6px;
      cursor: pointer;
      background: var(--bg-card);
      transition: border-color 0.12s;
      position: relative;
    }
    .trace-row:hover { border-color: var(--border-hi); }
    .trace-row.selected { border-color: var(--border-sel); background: rgba(15, 118, 110, 0.06); }
    .trace-row::before {
      content: ''; position: absolute; left: -1px; top: 6px; bottom: 6px;
      width: 2px; background: var(--accent); opacity: 0.6;
    }
    .trace-row.stale::before { background: var(--text-3); opacity: 1; }
    .tr-head { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
    .tr-id { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); }
    .tr-status {
      font-size: 9px; padding: 0 5px; border-radius: 2px;
      letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600;
    }
    .tr-status.active { color: var(--accent); background: rgba(110, 231, 255, 0.08); }
    .tr-status.stale { color: var(--text-2); background: rgba(120, 130, 160, 0.06); }
    .tr-label { font-size: 12px; color: var(--text-0); font-weight: 500; margin-bottom: 4px; }
    .tr-meta {
      display: flex; gap: 10px; font-size: 10px;
      color: var(--text-2); font-family: 'JetBrains Mono', monospace;
    }
    .tr-meta .k { color: var(--text-3); }

    /* Focus */
    .focus-divider { height: 1px; background: var(--border); margin-bottom: 16px; }
    .focus-empty { color: var(--text-3); font-size: 11px; padding: 12px 0; line-height: 1.5; }
    .focus-head { margin-bottom: 14px; }
    .focus-label { font-size: 16px; font-weight: 600; color: var(--text-0); line-height: 1.25; margin-bottom: 8px; }
    .focus-stats { padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; }
    .focus-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
    .focus-row .k { color: var(--text-2); }
    .focus-row .v { color: var(--text-0); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
    .bucket-chip { padding: 1px 7px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .bucket-chip.high { color: #ecfeff; background: var(--bucket-high); }
    .bucket-chip.med { color: #fff7ed; background: var(--bucket-med); }
    .bucket-chip.low { color: var(--text-1); background: rgba(168, 162, 158, 0.32); }

    .docs-title { font-size: 10px; font-weight: 600; letter-spacing: 0.18em; color: var(--text-2); text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .doc-row {
      padding: 9px 0;
      border-top: 1px solid var(--border);
      display: flex; gap: 9px; align-items: flex-start;
    }
    .doc-row:first-of-type { border-top: none; padding-top: 2px; }
    .doc-icon { flex: none; width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; }
    .doc-icon.saved { background: var(--accent); }
    .doc-icon.clicked { background: var(--amber); }
    .doc-icon.viewed { background: var(--text-2); }
    .doc-body { flex: 1; min-width: 0; }
    .doc-title { font-size: 11px; line-height: 1.35; color: var(--text-0); margin-bottom: 2px; }
    .doc-meta { font-size: 9px; color: var(--text-2); font-family: 'JetBrains Mono', monospace; display: flex; gap: 8px; }
    .doc-meta .conf { color: var(--accent); }

    /* ───── Settings cog + modal ───── */
    .cog-btn {
      width: 28px; height: 28px; border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s, background 0.12s;
      margin-left: 6px;
    }
    .cog-btn:hover { border-color: var(--border-hi); color: var(--text-0); background: rgba(28,25,23,0.04); }
    .cog-btn svg { width: 14px; height: 14px; }

    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(20, 17, 10, 0.45);
      backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal {
      width: 480px; max-width: 92vw;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 22px 22px 18px;
      box-shadow: 0 24px 80px rgba(20, 17, 10, 0.25);
    }
    .modal-title { font-size: 14px; font-weight: 600; color: var(--text-0); margin-bottom: 4px; }
    .modal-sub { font-size: 11px; color: var(--text-2); margin-bottom: 16px; line-height: 1.5; }
    .modal-label { font-size: 10px; font-weight: 600; letter-spacing: 0.16em; color: var(--text-2); text-transform: uppercase; margin-bottom: 6px; display: block; }
    .modal-input, .modal-textarea {
      width: 100%; padding: 8px 10px;
      border: 1px solid var(--border-hi);
      background: var(--bg);
      color: var(--text-0);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      border-radius: 4px;
      outline: none;
      margin-bottom: 14px;
    }
    .modal-input:focus, .modal-textarea:focus { border-color: var(--border-sel); }
    .modal-textarea { resize: vertical; min-height: 90px; line-height: 1.4; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .btn {
      padding: 7px 14px; border-radius: 4px;
      font-size: 12px; font-weight: 500;
      border: 1px solid var(--border-hi);
      background: transparent; color: var(--text-1);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s, color 0.12s;
      font-family: inherit;
    }
    .btn:hover { border-color: var(--text-2); color: var(--text-0); }
    .btn-primary {
      background: var(--accent); color: #ecfeff; border-color: var(--accent);
    }
    .btn-primary:hover { background: #134e4a; border-color: #134e4a; color: #ecfeff; }
    .modal-status {
      margin-top: 12px; padding: 8px 10px;
      border-radius: 4px; font-size: 11px;
      border: 1px solid;
    }
    .modal-status.ok { border-color: rgba(21,128,61,0.3); background: rgba(21,128,61,0.06); color: var(--green); }
    .modal-status.err { border-color: rgba(194,65,12,0.3); background: rgba(194,65,12,0.06); color: var(--amber); }
    .modal-status.info { border-color: var(--border-hi); background: rgba(0,0,0,0.02); color: var(--text-2); }

    /* live mode pill variants */
    .live-pill.snapshot {
      border-color: rgba(168, 162, 158, 0.4);
      background: rgba(168, 162, 158, 0.1);
      color: var(--text-2);
    }
    .live-pill.snapshot .live-dot { background: var(--text-3); box-shadow: none; animation: none; }
    .live-pill.err {
      border-color: rgba(194, 65, 12, 0.4);
      background: rgba(194, 65, 12, 0.08);
      color: var(--amber);
    }
    .live-pill.err .live-dot { background: var(--amber); box-shadow: 0 0 4px rgba(194,65,12,0.5); }

    /* new user card fade-in */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user-card.fresh {
      animation: cardIn 0.4s ease-out;
      box-shadow: inset 0 0 0 1px rgba(15, 118, 110, 0.3), 0 0 16px rgba(15, 118, 110, 0.08);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(28, 25, 23, 0.14); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(28, 25, 23, 0.28); }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

    const W = 1920, H = 1080;
    const PADDING = 80;
    const px = (n) => PADDING + n * (W - 2 * PADDING);
    const py = (n) => PADDING + n * (H - 2 * PADDING);

    /* ═══════════════════ LIVE MODE INFRA ═══════════════════ */
    const API_BASE = (new URLSearchParams(location.search).get('api')) || 'http://localhost:8000';
    const POLL_USERS_MS  = 5000;

    /* ─── Auth storage (access + refresh + expiry) ─── */
    const AUTH_KEYS = { access: 'skku_admin_access', refresh: 'skku_admin_refresh', exp: 'skku_admin_exp', email: 'skku_admin_email' };
    function readStoredAuth() {
      // back-compat: migrate old key 'skku_admin_jwt' → new schema (no refresh, no exp)
      const legacy = localStorage.getItem('skku_admin_jwt');
      if (legacy && !localStorage.getItem(AUTH_KEYS.access)) {
        localStorage.setItem(AUTH_KEYS.access, legacy);
        localStorage.removeItem('skku_admin_jwt');
      }
      return {
        access: localStorage.getItem(AUTH_KEYS.access) || '',
        refresh: localStorage.getItem(AUTH_KEYS.refresh) || '',
        exp: parseInt(localStorage.getItem(AUTH_KEYS.exp) || '0', 10) || 0,
        email: localStorage.getItem(AUTH_KEYS.email) || '',
      };
    }
    function writeStoredAuth(access, refresh, expiresInSec, email) {
      if (!access) {
        Object.values(AUTH_KEYS).forEach(k => localStorage.removeItem(k));
        return;
      }
      localStorage.setItem(AUTH_KEYS.access, access);
      if (refresh) localStorage.setItem(AUTH_KEYS.refresh, refresh);
      if (expiresInSec) localStorage.setItem(AUTH_KEYS.exp, String(Date.now() + expiresInSec * 1000));
      if (email) localStorage.setItem(AUTH_KEYS.email, email);
    }

    async function rawApiFetch(path, token, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
      if (!res.ok) {
        const text = await res.text().catch(() => '');
        const err = new Error(`HTTP ${res.status}`);
        err.status = res.status; err.body = text;
        throw err;
      }
      return res.json();
    }

    async function postJson(path, body) {
      return rawApiFetch(path, null, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
    }

    /* ─── Deterministic hash → [0,1) ─── */
    function hash01(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      return (h % 100000) / 100000;
    }
    const bucketYCenter = { high: 0.35, med: 0.5, low: 0.65 };
    function layoutTopic(topic) {
      const seed = topic.label || topic.id;
      const a = hash01(seed + ':x');
      const b = hash01(seed + ':y');
      const yC = bucketYCenter[topic.bucket] ?? 0.5;
      return {
        x: 0.10 + a * 0.80,
        y: yC - 0.12 + b * 0.24,
      };
    }

    /* ─── Density-aware layout: collision relaxation in [0,1] space ───
       Input: topics with initial x,y (already in unit square).
       Output: Map<topic.id, {x,y}> where pairwise distance ≥ minDist.
       minDist scales with N so 10 nodes get spread out, 1000 nodes packed tight. */
    function relaxPositions(topics) {
      const N = topics.length;
      if (N === 0) return new Map();
      const pts = topics.map(t => {
        const init = (t.x != null && t.y != null) ? { x: t.x, y: t.y } : layoutTopic({ id: t.id, label: t.label, bucket: t.bucket });
        return { id: t.id, x: init.x, y: init.y };
      });
      const minDist = Math.max(0.022, Math.min(0.18, Math.sqrt(0.55 / Math.max(N, 4))));
      const iters = N <= 50 ? 40 : N <= 200 ? 60 : 80;
      for (let iter = 0; iter < iters; iter++) {
        let moved = 0;
        for (let i = 0; i < N; i++) {
          for (let j = i + 1; j < N; j++) {
            const dx = pts[j].x - pts[i].x;
            const dy = pts[j].y - pts[i].y;
            const d = Math.hypot(dx, dy);
            if (d < minDist && d > 1e-6) {
              const push = (minDist - d) * 0.5;
              const nx = dx / d, ny = dy / d;
              pts[i].x -= nx * push;
              pts[i].y -= ny * push;
              pts[j].x += nx * push;
              pts[j].y += ny * push;
              moved++;
            } else if (d < 1e-6) {
              // exact overlap — nudge deterministically by id
              pts[j].x += 0.005;
              pts[j].y += 0.005;
              moved++;
            }
          }
        }
        for (const p of pts) {
          p.x = Math.max(0.05, Math.min(0.95, p.x));
          p.y = Math.max(0.07, Math.min(0.93, p.y));
        }
        if (moved === 0) break;
      }
      return new Map(pts.map(p => [p.id, { x: p.x, y: p.y }]));
    }

    /* ─── Render scale based on node count ─── */
    function nodeScale(N) {
      // 1.0 at N≤20 → 0.32 at N=200 → ~0.14 at N=1000, floor 0.30
      return Math.min(1.0, Math.max(0.30, Math.sqrt(22 / Math.max(N, 22))));
    }

    /* ─── Label visibility policy ─── */
    function labelableSet(topics, selectedId) {
      const out = new Set();
      if (selectedId) out.add(selectedId);
      const N = topics.length;
      if (N <= 30) {
        for (const t of topics) out.add(t.id);
      } else if (N <= 100) {
        for (const t of topics) if (t.bucket === 'high') out.add(t.id);
        // top 8 high+med by score as backup
        if (out.size < 6) {
          const top = [...topics].sort((a, b) => (b.score ?? 0) - (a.score ?? 0)).slice(0, 8);
          for (const t of top) out.add(t.id);
        }
      } else {
        const top = [...topics].sort((a, b) => (b.score ?? 0) - (a.score ?? 0)).slice(0, 10);
        for (const t of top) out.add(t.id);
      }
      return out;
    }

    /* ─── Bucket normalization ─── */
    function normBucket(raw) {
      if (!raw) return 'low';
      const v = String(raw).toLowerCase();
      if (v === 'high') return 'high';
      if (v === 'medium' || v === 'med') return 'med';
      if (v === 'low') return 'low';
      return 'low'; // NEUTRAL → treat as low
    }
    function normStatus(raw) {
      if (!raw) return 'stale';
      const v = String(raw).toLowerCase();
      return v === 'active' ? 'active' : v === 'archived' ? 'archived' : 'stale';
    }

    /* ─── Transform live backend responses → frontend user shape ─── */
    function buildLiveUser(listItem, stateRes, tracesRes) {
      const uid = listItem.user_id;
      const shortId = uid.replace(/-/g, '').slice(0, 6);
      // Topics — derive id from cso_topic_id or leaf_topic_id; layout deterministically
      const topicsRaw = (stateRes?.topics || []).map(t => {
        const id = (t.leaf_topic_id || t.cso_topic_id || t.label || '').toString();
        const bucket = normBucket(t.bucket);
        const score = Math.max(t.long_score ?? 0, t.short_score ?? 0);
        const onb = !!t.is_onboarding_selected;
        const { x, y } = layoutTopic({ id, label: t.label, bucket });
        return { id, label: t.label || '(unlabeled)', x, y, bucket, score, onb, docs: 0 };
      });
      // dedupe by id (label keying) — keep first
      const seenIds = new Set();
      const topics = [];
      for (const t of topicsRaw) {
        if (seenIds.has(t.id)) continue;
        seenIds.add(t.id);
        topics.push(t);
      }
      // Map label → id for trace path resolution
      const labelToId = Object.fromEntries(topics.map(t => [t.label, t.id]));

      // Traces — path arrives as label strings; map to topic ids; drop labels we don't have
      const traces = (tracesRes?.items || tracesRes || []).map(tr => {
        const labels = tr.path_labels || tr.path || [];
        const path = labels.map(lb => labelToId[lb]).filter(Boolean);
        const span = (tr.last_activity_active_day ?? 0) - (tr.started_active_day ?? 0);
        return {
          id: tr.trace_id,
          shortId: (tr.trace_id || '').toString().slice(0, 6),
          label: labels[labels.length - 1] || `trace ${(tr.trace_id || '').toString().slice(0, 6)}`,
          status: normStatus(tr.status),
          path,
          days: Math.max(0, span),
          opLast: '—',
        };
      }).filter(tr => tr.path.length > 0);

      const activeCount = traces.filter(t => t.status === 'active').length;
      const updatedAt = stateRes?.updated_at ? new Date(stateRes.updated_at) : null;
      const nowMs = Date.now();
      const lastActiveMin = updatedAt ? Math.max(0, Math.round((nowMs - updatedAt.getTime()) / 60000)) : 999;
      const online = lastActiveMin < 5;

      return {
        id: uid,
        shortId,
        persona: listItem.email || '(no email)',
        createdAt: listItem.created_at,
        activeDay: 0,
        totalDay: 0,
        lastActiveMin,
        online,
        topics,
        traces,
        docs: {}, // populated by per-topic poll
        live: true,
      };
    }

    /* ─── React hooks: auth + polling ─── */
    function useAdminAuth() {
      const [auth, setAuth] = useState(() => readStoredAuth());
      const [error, setError] = useState(null);
      const accessRef = useRef(auth.access);
      const refreshInflight = useRef(null);
      useEffect(() => { accessRef.current = auth.access; }, [auth.access]);

      const applyTokens = (r, email) => {
        writeStoredAuth(r.access_token, r.refresh_token, r.expires_in, email);
        setAuth({
          access: r.access_token,
          refresh: r.refresh_token || '',
          exp: Date.now() + (r.expires_in || 900) * 1000,
          email: email || auth.email,
        });
      };

      const doRefresh = async () => {
        if (refreshInflight.current) return refreshInflight.current;
        const stored = readStoredAuth();
        if (!stored.refresh) { setError('no refresh token'); return null; }
        refreshInflight.current = (async () => {
          try {
            const r = await postJson('/admin/auth/refresh', { refresh_token: stored.refresh });
            applyTokens(r, stored.email);
            setError(null);
            return r.access_token;
          } catch (e) {
            // refresh failed → wipe stored creds, surface error
            writeStoredAuth('', '', 0, '');
            setAuth({ access: '', refresh: '', exp: 0, email: '' });
            setError(e.message || 'refresh failed');
            return null;
          } finally {
            refreshInflight.current = null;
          }
        })();
        return refreshInflight.current;
      };

      // Schedule auto-refresh 60s before access expiry
      useEffect(() => {
        if (!auth.exp || !auth.refresh) return;
        const ms = Math.max(2000, auth.exp - Date.now() - 60_000);
        const t = setTimeout(doRefresh, ms);
        return () => clearTimeout(t);
      }, [auth.exp, auth.refresh]);

      const login = async (email, password) => {
        setError(null);
        try {
          const r = await postJson('/admin/auth/login', { email, password });
          applyTokens(r, email);
          return true;
        } catch (e) {
          // backend may return { code, message } JSON in err.body
          let msg = e.message;
          try { const parsed = JSON.parse(e.body || '{}'); if (parsed.message) msg = parsed.message; } catch {}
          setError(msg);
          return false;
        }
      };

      const logout = () => {
        writeStoredAuth('', '', 0, '');
        setAuth({ access: '', refresh: '', exp: 0, email: '' });
        setError(null);
      };

      // Wrapped fetch: uses live token, auto-retries once on 401 after refresh
      const apiFetch = useCallback(async (path, opts = {}) => {
        const t1 = accessRef.current;
        try {
          return await rawApiFetch(path, t1, opts);
        } catch (e) {
          if (e.status !== 401) throw e;
          const t2 = await doRefresh();
          if (!t2) throw e;
          return await rawApiFetch(path, t2, opts);
        }
      }, []);

      return { auth, error, login, logout, apiFetch, authed: !!auth.access };
    }

    function useUserList(apiFetch, authed) {
      const [list, setList] = useState([]);
      const [error, setError] = useState(null);
      const [loaded, setLoaded] = useState(false);
      useEffect(() => {
        if (!authed) { setList([]); setLoaded(false); return; }
        let cancelled = false;
        const ac = new AbortController();
        async function tick() {
          try {
            const res = await apiFetch('/admin/users?limit=100', { signal: ac.signal });
            if (cancelled) return;
            setList(res.items || []);
            setError(null);
            setLoaded(true);
          } catch (e) {
            if (cancelled || e.name === 'AbortError') return;
            setError(e);
          }
        }
        tick();
        const i = setInterval(tick, POLL_USERS_MS);
        return () => { cancelled = true; ac.abort(); clearInterval(i); };
      }, [apiFetch, authed]);
      return { list, error, loaded };
    }

    function useUserStateBundle(apiFetch, authed, userIds) {
      const [bundle, setBundle] = useState({});
      const ref = useRef({});
      useEffect(() => {
        if (!authed || userIds.length === 0) return;
        let cancelled = false;
        const ac = new AbortController();
        async function pollAll() {
          await Promise.allSettled(userIds.map(async uid => {
            try {
              const [state, traces] = await Promise.all([
                apiFetch(`/admin/users/${uid}/interest-state`, { signal: ac.signal }),
                apiFetch(`/admin/users/${uid}/traces?limit=20`, { signal: ac.signal }),
              ]);
              if (cancelled) return;
              ref.current[uid] = { state, traces };
            } catch (e) {
              if (e.name === 'AbortError') return;
              // keep last known
            }
          }));
          if (!cancelled) setBundle({ ...ref.current });
        }
        pollAll();
        const i = setInterval(pollAll, POLL_STATE_MS);
        return () => { cancelled = true; ac.abort(); clearInterval(i); };
      }, [apiFetch, authed, userIds.join('|')]);
      return bundle;
    }

    function useTopicDocs(apiFetch, authed, userId, topicId) {
      const [docs, setDocs] = useState([]);
      useEffect(() => {
        if (!authed || !userId || !topicId) { setDocs([]); return; }
        let cancelled = false;
        const ac = new AbortController();
        async function tick() {
          try {
            const res = await apiFetch(
              `/admin/users/${userId}/topics/${topicId}/documents?limit=20`,
              { signal: ac.signal }
            );
            if (cancelled) return;
            const items = (res.items || []).map(it => ({
              title: it.title || '(no title)',
              conf: it.recommendation_score ?? it.confidence ?? 0,
              evt: 'viewed',
              day: 0,
            }));
            setDocs(items);
          } catch (e) {
            if (e.name === 'AbortError') return;
          }
        }
        tick();
        const i = setInterval(tick, POLL_DOCS_MS);
        return () => { cancelled = true; ac.abort(); clearInterval(i); };
      }, [apiFetch, authed, userId, topicId]);
      return docs;
    }

    /* ═══════════════════ HELPERS ═══════════════════ */
    function quadCurve(p1, p2) {
      const mx = (p1.x + p2.x) / 2;
      const my = (p1.y + p2.y) / 2;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.hypot(dx, dy) || 1;
      const offset = Math.min(len * 0.10, 22);
      const nx = -dy / len, ny = dx / len;
      const cx = mx + nx * offset;
      const cy = my + ny * offset;
      return `M${p1.x},${p1.y} Q${cx},${cy} ${p2.x},${p2.y}`;
    }
    function tracePath(trace, topicById) {
      const pts = trace.path.map(id => {
        const t = topicById[id];
        return { x: px(t.x), y: py(t.y) };
      });
      if (pts.length < 2) return '';
      let d = '';
      for (let i = 0; i < pts.length - 1; i++) {
        const seg = quadCurve(pts[i], pts[i + 1]);
        d += (i === 0 ? seg : seg.replace(/^M[^Q]+/, ' '));
      }
      return d;
    }

    function Graph({ user, selectedTopic, selectedTrace, onTopicSelect }) {
      const N = user.topics.length;
      // Relaxed positions — stable across re-polls (keyed by user.id + topic id set)
      const posKey = user.id + '|' + user.topics.map(t => t.id).sort().join(',');
      const positions = useMemo(() => relaxPositions(user.topics), [posKey]);
      const topicById = useMemo(() => {
        const map = {};
        for (const t of user.topics) {
          const p = positions.get(t.id) || { x: t.x ?? 0.5, y: t.y ?? 0.5 };
          map[t.id] = { ...t, x: p.x, y: p.y };
        }
        return map;
      }, [user.topics, positions]);
      const scale = useMemo(() => nodeScale(N), [N]);
      const labelable = useMemo(
        () => labelableSet(user.topics, selectedTopic),
        [user.topics, selectedTopic]
      );

      return (
        <div className="panel-graph">
          <div className="graph-meta">
            <div className="gm-1">{user.persona}</div>
            <div className="gm-2">#{user.shortId}</div>
          </div>
          <svg className="graph-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet">
            <defs>
              <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.5" />
              </filter>
            </defs>

            {/* Edges (trace paths) — use relaxed positions */}
            {user.traces.map(tr => {
              const d = tracePath(tr, topicById);
              if (!d) return null;
              const isSel = selectedTrace === tr.id;
              return (
                <path
                  key={tr.id}
                  d={d}
                  className={`edge ${tr.status} ${isSel ? 'selected' : ''}`}
                />
              );
            })}

            {/* Nodes */}
            {user.topics.map(t => {
              const placed = topicById[t.id];
              const cx = px(placed.x), cy = py(placed.y);
              const r = Math.max(2.4, BUCKET_R[t.bucket] * scale);
              const fill = BUCKET_FILL[t.bucket];
              const sel = selectedTopic === t.id;
              const showLabel = labelable.has(t.id);
              return (
                <g
                  key={t.id}
                  className={`node-group ${sel ? 'selected' : ''}`}
                  onClick={() => onTopicSelect(t.id)}
                >
                  {t.onb && <circle className="node-onb" cx={cx} cy={cy} r={r + 5} />}
                  <circle className="node-core" cx={cx} cy={cy} r={r} fill={fill} />
                  <text
                    className={`node-label ${t.bucket === 'high' ? 'hi' : t.bucket === 'low' ? 'dim' : ''} ${showLabel ? '' : 'hidden'}`}
                    x={cx}
                    y={cy + r + Math.max(11, 15 * scale)}
                    textAnchor="middle"
                  >
                    {t.label}
                  </text>
                </g>
              );
            })}
          </svg>
          <div className="graph-legend">
            <div className="lg-item"><span className="lg-dot high" /> high</div>
            <div className="lg-item"><span className="lg-dot med" /> med</div>
            <div className="lg-item"><span className="lg-dot low" /> low</div>
            <div className="lg-item" style={{ marginLeft: 12 }}><span className="lg-line active" /> active trace</div>
            <div className="lg-item"><span className="lg-line stale" /> stale</div>
            <div className="lg-item" style={{ marginLeft: 12, color: 'var(--text-3)' }}>○ onboarding</div>
            <div className="lg-item" style={{ marginLeft: 12, color: 'var(--text-3)' }}>N={N}</div>
          </div>
        </div>
      );
    }

    /* ═══════════════════ APP ═══════════════════ */
    function App() {
      const { auth, error: authError, login, logout, apiFetch, authed } = useAdminAuth();
      const [showSettings, setShowSettings] = useState(false);
      const [now, setNow] = useState(() => new Date());

      useEffect(() => {
        const i = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(i);
      }, []);

      // ─── Live data layer ───
      const { list: liveList, error: listErr, loaded: listLoaded } = useUserList(apiFetch, authed);
      const liveUserIds = useMemo(
        () => liveList.map(u => u.user_id),
        [liveList.map(u => u.user_id).join('|')]
      );
      const bundle = useUserStateBundle(apiFetch, authed, liveUserIds);

      const liveUsers = useMemo(() => {
        return liveList.map(item => {
          const slot = bundle[item.user_id] || {};
          return buildLiveUser(item, slot.state || { topics: [] }, slot.traces || { items: [] });
        });
      }, [liveList, bundle]);

      // ─── Track fresh (newly arrived) users for highlight animation ───
      const seenIdsRef = useRef(new Set());
      const [freshIds, setFreshIds] = useState(new Set());
      useEffect(() => {
        if (!liveUsers.length) return;
        const incoming = new Set(liveUsers.map(u => u.id));
        const fresh = new Set();
        for (const id of incoming) {
          if (!seenIdsRef.current.has(id)) fresh.add(id);
        }
        seenIdsRef.current = incoming;
        if (fresh.size) {
          setFreshIds(fresh);
          const t = setTimeout(() => setFreshIds(new Set()), 2500);
          return () => clearTimeout(t);
        }
      }, [liveUsers]);

      // ─── Status pill ───
      const isLive = authed && listLoaded && !listErr;
      const liveStatus = !authed ? 'snapshot' : (listErr ? 'err' : (isLive ? 'live' : 'snapshot'));

      // ─── Effective users (live or mock) ───
      const users = isLive ? liveUsers : MOCK_USERS;

      // ─── Selection state ───
      const [selectedUserId, setSelectedUserId] = useState(MOCK_USERS[0].id);
      const [selectedTopic, setSelectedTopic] = useState('rag');
      const [selectedTrace, setSelectedTrace] = useState(3);

      // Auto-pick first user when switching to live mode for the first time
      useEffect(() => {
        if (!isLive || users.length === 0) return;
        if (!users.find(u => u.id === selectedUserId)) {
          const first = users[0];
          setSelectedUserId(first.id);
          const firstActive = first.traces.find(t => t.status === 'active') || first.traces[0];
          setSelectedTrace(firstActive?.id ?? null);
          if (firstActive && firstActive.path.length) {
            setSelectedTopic(firstActive.path[firstActive.path.length - 1]);
          } else {
            setSelectedTopic(first.topics[0]?.id ?? null);
          }
        }
      }, [isLive, users, selectedUserId]);

      const user = users.find(u => u.id === selectedUserId) || users[0];

      // ─── Per-topic doc poll (live mode only, for selected user+topic) ───
      const liveDocs = useTopicDocs(
        apiFetch,
        isLive,
        isLive ? selectedUserId : '',
        isLive ? selectedTopic : ''
      );

      const handleUserSelect = (id) => {
        setSelectedUserId(id);
        const u = users.find(x => x.id === id);
        if (u) {
          const firstActive = u.traces.find(t => t.status === 'active') || u.traces[0];
          setSelectedTrace(firstActive?.id ?? null);
          if (firstActive && firstActive.path.length) {
            setSelectedTopic(firstActive.path[firstActive.path.length - 1]);
          } else {
            setSelectedTopic(u.topics[0]?.id ?? null);
          }
        }
      };

      const handleTraceSelect = (id) => {
        setSelectedTrace(id);
        const tr = user?.traces.find(t => t.id === id);
        if (tr && tr.path.length) setSelectedTopic(tr.path[tr.path.length - 1]);
      };

      if (!user) {
        return (
          <div className="app">
            <Header
              user={{ shortId: '——', topics: [], traces: [] }}
              now={now}
              liveStatus={liveStatus}
              onSettings={() => setShowSettings(true)}
            />
            <div className="panel-users" />
            <div className="panel-graph" />
            <div className="panel-detail" />
            <SettingsModal
              open={showSettings}
              authed={authed}
              email={auth.email}
              authError={authError}
              listError={listErr}
              onLogin={login}
              onLogout={logout}
              onClose={() => setShowSettings(false)}
            />
          </div>
        );
      }

      // For live mode, focus topic uses live docs; for mock, look up from user.docs
      const detailUser = isLive
        ? { ...user, docs: { [selectedTopic]: liveDocs } }
        : user;

      return (
        <div className="app">
          <Header
            user={user}
            now={now}
            liveStatus={liveStatus}
            onSettings={() => setShowSettings(true)}
          />
          <UsersPanel
            users={users}
            selectedId={selectedUserId}
            onSelect={handleUserSelect}
            freshIds={freshIds}
          />
          <Graph
            user={user}
            selectedTopic={selectedTopic}
            selectedTrace={selectedTrace}
            onTopicSelect={setSelectedTopic}
          />
          <DetailPanel
            user={detailUser}
            selectedTopic={selectedTopic}
            selectedTrace={selectedTrace}
            onTraceSelect={handleTraceSelect}
          />
          <SettingsModal
            open={showSettings}
            authed={authed}
            email={auth.email}
            authError={authError}
            listError={listErr}
            onLogin={login}
            onLogout={logout}
            onClose={() => setShowSettings(false)}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
